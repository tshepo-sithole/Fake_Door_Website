{% extends "base.html" %}

{% block content %}
<body>
  <div class="container-fluid">
    <img src="static/Logo/logo side default no background.png" width="400" alt="Logo">
  </div>
  <div class="container-fluid">
    <div class="container-fluid px-4 text-center">
      <div class="row align-items-center">
        <div class="col-12 col-md-6 p-5 d-flex flex-column justify-content-center order-2 order-md-1" style="height: 74vh;">
          <p style="font-size: clamp(30px, 4vw, 50px);">BATCH INVOICES TO <br>EXCEL TOOL</p>
          <p style="font-size: clamp(10px, 3vw, 25px);">Tired of manually typing hundreds of invoice data (amounts, quantities, customer names, etc.) into an excel document? Rest assured, this tool is for you. <br>Download now to try it out!</p>
          <div style="text-align: center; width: 100%;">
            <a href="{{ url_for('download_page') }}" class="btn-pulse"
               style="background-color: #28a745; color: white; border: none; text-decoration: none;
               padding: 10px 24px; border-radius: 4px; font-size: 16px; cursor: pointer; display: inline-block;">Download Now
            </a>
          </div>
        </div>
        <div class="col-12 col-md-6 p-1 order-1 order-md-2 d-flex justify-content-center align-items-center">
          <div class="comparison-slider" id="compSlider" style="width: 100%; aspect-ratio: 16 / 9;">
            <img src="static/assets/invoices before.jpg" alt="Before" class="img-before img-fluid rounded">
            <img src="static/assets/invoices after.jpg" alt="After" class="img-after img-fluid rounded">
            <span class="slider-status-badge" id="sliderBadge">BEFORE</span>
            <div class="slider-bar" id="sliderBar"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="container-fluid p-3">
  </div>
</body>
{% endblock %}
